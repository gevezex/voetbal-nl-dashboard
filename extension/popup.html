<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; width: 320px; color: #111; }
    header { background: #16a34a; color: #fff; padding: 14px 16px; }
    header h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0; }
    header .logo { width: 32px; height: 32px; flex-shrink: 0; object-fit: contain; }
    header p { font-size: 11px; margin: 4px 0 0; opacity: .9; }
    .controls { padding: 14px; border-bottom: 1px solid #e5e7eb; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .toggle input { appearance: none; width: 38px; height: 22px; margin: 0; border-radius: 12px; background: #94a3b8; position: relative; flex-shrink: 0; cursor: pointer; }
    .toggle input::after { content: ''; position: absolute; width: 16px; height: 16px; top: 3px; left: 3px; border-radius: 50%; background: white; transition: transform .15s; }
    .toggle input:checked { background: #16a34a; }
    .toggle input:checked::after { transform: translateX(16px); }
    .toggle input:focus-visible { outline: 2px solid #0f172a; outline-offset: 3px; }
    .hint { font-size: 11px; color: #64748b; margin: 7px 0 0; }
    .history-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 0; }
    .history-header h2 { margin: 0; font-size: 13px; }
    #clear-poules { background: none; border: 1px solid #fecaca; color: #b91c1c; border-radius: 6px; padding: 5px 7px; font-size: 11px; cursor: pointer; }
    button:disabled, input:disabled { opacity: .5; cursor: default !important; }
    #status { margin: 8px 14px; font-size: 12px; color: #475569; }
    #status:empty { display: none; }
    #poules { padding: 12px 14px; }
    .empty { font-size: 13px; color: #555; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .row:last-child { border-bottom: none; }
    .row b { font-size: 13px; display: block; }
    .row .sub { font-size: 11px; color: #777; }
    .row button { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .row button:hover { background: #15803d; }
  </style>
</head>
<body>
  <header>
    <h1><img class="logo" src="icons/icon.svg" width="32" height="32" alt="">Voetbal.nl Poule Dashboard</h1>
    <p>Ga naar een team/poule op voetbal.nl en klik op de groene knop.</p>
  </header>
  <section class="controls">
    <label class="toggle" for="dashboard-enabled">Knop op voetbal.nl <input id="dashboard-enabled" type="checkbox" role="switch" disabled></label>
    <p class="hint" id="enabled-hint">Instelling laden…</p>
  </section>
  <div class="history-header"><h2>Opgeslagen dashboards</h2><button id="clear-poules" disabled>Alles verwijderen</button></div>
  <p class="hint" style="padding: 0 14px">Verwijdert alle lokaal opgeslagen dashboards.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="poules"><p class="empty">Laden…</p></div>
  <script src="popup.js"></script>
</body>
</html>
