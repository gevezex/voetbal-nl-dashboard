<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voetbal.nl Poule Dashboard</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; text-align: center;
    }
    .card { max-width: 560px; padding: 32px; }
    img { width: 96px; height: 96px; object-fit: contain; }
    h1 { font-size: 30px; margin: 18px 0 6px; }
    p { opacity: .92; line-height: 1.6; }
    a { color: #dcfce7; }
    .btn {
      display: inline-block; margin-top: 18px; padding: 12px 20px; border-radius: 12px;
      background: #fff; color: #15803d; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.svg" alt="Voetbal.nl Poule Dashboard" />
    <h1>Voetbal.nl Poule Dashboard</h1>
    <p>
      Maak van elke KNVB-jeugdpoule op voetbal.nl een compleet statistiek- en
      voorspellingsdashboard — volledig lokaal in je browser.
    </p>
    <a class="btn" href="privacy.html">Privacybeleid</a>
    <p><a href="https://github.com/gevezex/voetbal-nl-dashboard">Broncode op GitHub</a></p>
  </div>
</body>
</html>
